# CI/CD Backend — Ayam Bakar Nusantara
# - Push/PR ke main (path backend) → check + validasi Docker image (cloud runner).
# - Deploy ke homelab hanya pada push ke main, lewat self-hosted runner (docker compose).
# - Integration test (menghapus data demo) hanya manual via workflow_dispatch, memakai
#   Supabase project TEST (bukan produksi pacojfmbhiejylcfirot).

name: Backend CI/CD

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
      - "docker-compose.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
      - "docker-compose.yml"
  workflow_dispatch:
    inputs:
      run_integration_tests:
        description: "Jalankan integration test ke Supabase project TEST (menghapus data demo). Butuh secrets lengkap + project test ter-provisioning."
        type: boolean
        default: false

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Syntax check semua file src
        run: |
          set -euo pipefail
          for f in $(find src -name '*.js' -type f); do node --check "$f"; done
          echo "OK: semua file src valid"

  docker-build:
    name: Validasi Docker image
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - name: Build image backend
        run: docker build -t abn-backend:ci ./backend

  integration-test:
    name: Integration test (project TEST)
    runs-on: ubuntu-latest
    needs: check
    if: github.event_name == 'workflow_dispatch' && inputs.run_integration_tests
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      PORT: "5000"
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      MIDTRANS_CLIENT_KEY: ${{ secrets.MIDTRANS_CLIENT_KEY }}
      MIDTRANS_SERVER_KEY: ${{ secrets.MIDTRANS_SERVER_KEY }}
      MIDTRANS_IS_PRODUCTION: ${{ secrets.MIDTRANS_IS_PRODUCTION }}
      OMNIROUTE_API_KEY: ${{ secrets.OMNIROUTE_API_KEY }}
      OMNIROUTE_API_URL: ${{ secrets.OMNIROUTE_API_URL }}
      OMNIROUTE_MODEL: ${{ secrets.OMNIROUTE_MODEL }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
      CORS_ALLOWED_ORIGINS: ${{ secrets.CORS_ALLOWED_ORIGINS }}
      DEMO_CUSTOMER_EMAIL: ${{ secrets.DEMO_CUSTOMER_EMAIL }}
      DEMO_CUSTOMER_PASSWORD: ${{ secrets.DEMO_CUSTOMER_PASSWORD }}
      DEMO_SELLER1_EMAIL: ${{ secrets.DEMO_SELLER1_EMAIL }}
      DEMO_SELLER1_PASSWORD: ${{ secrets.DEMO_SELLER1_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Jalankan integration test
        run: npm test

  deploy:
    name: Deploy ke homelab (self-hosted)
    runs-on: self-hosted
    needs: [check, docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Pull & build & up (docker compose)
        run: |
          set -euo pipefail
          cd /media/bazyngan/DATA/Documents/ayam-bakar-nusantara
          git pull --ff-only
          docker compose up -d --build
      - name: Verifikasi container
        run: |
          sleep 8
          docker compose -f /media/bazyngan/DATA/Documents/ayam-bakar-nusantara/docker-compose.yml ps --format "table {{.Service}}\t{{.Status}}"
