# CI — Backend Checks
# Runs on every push/PR to main (backend/ paths).
# Validates syntax, lint (if configured), unit tests, and build.

name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1. Syntax & Unit Tests (no DB required)
  check:
    name: Syntax & Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Syntax check all source files
        run: |
          set -euo pipefail
          for f in $(find src -name "*.js" -type f); do
            node --check "$f"
          done
          echo "All source files pass syntax check"

      - name: Run unit tests (no DB)
        run: npx vitest run tests/security-fixes.test.js tests/new-fixes.test.js --reporter=verbose
        env:
          NODE_ENV: test
          PORT: "5000"
          # Use dummy values — unit tests don't need real DB
          SUPABASE_URL: "https://dummy.supabase.co"
          SUPABASE_ANON_KEY: "dummy-anon"
          SUPABASE_SERVICE_ROLE_KEY: "dummy-service"
          MIDTRANS_CLIENT_KEY: "dummy-client"
          MIDTRANS_SERVER_KEY: "dummy-server"
          MIDTRANS_IS_PRODUCTION: "false"
          OMNIROUTE_API_KEY: "dummy-omniroute"
          OMNIROUTE_API_URL: "https://dummy.omniroute/v1"
          OMNIROUTE_MODEL: "auto"
          RESEND_API_KEY: "dummy-resend"
          RESEND_FROM_EMAIL: "noreply@dummy.com"
          CORS_ALLOWED_ORIGINS: "http://localhost:3000"
          DEMO_CUSTOMER_EMAIL: "dummy@customer.com"
          DEMO_CUSTOMER_PASSWORD: "dummy123"
          DEMO_SELLER1_EMAIL: "dummy@seller.com"
          DEMO_SELLER1_PASSWORD: "dummy123"

  # 2. Integration Tests (requires Supabase DEV project & secrets)
  integration-test:
    name: Integration Tests (Supabase DEV)
    runs-on: ubuntu-latest
    needs: check
    # Only runs if SUPABASE_URL secret is configured (skips gracefully otherwise)
    if: ${{ vars.RUN_INTEGRATION_TESTS == 'true' }}
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      PORT: "5000"
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      MIDTRANS_CLIENT_KEY: ${{ secrets.MIDTRANS_CLIENT_KEY }}
      MIDTRANS_SERVER_KEY: ${{ secrets.MIDTRANS_SERVER_KEY }}
      MIDTRANS_IS_PRODUCTION: ${{ secrets.MIDTRANS_IS_PRODUCTION }}
      OMNIROUTE_API_KEY: ${{ secrets.OMNIROUTE_API_KEY }}
      OMNIROUTE_API_URL: ${{ secrets.OMNIROUTE_API_URL }}
      OMNIROUTE_MODEL: ${{ secrets.OMNIROUTE_MODEL }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
      CORS_ALLOWED_ORIGINS: ${{ secrets.CORS_ALLOWED_ORIGINS }}
      DEMO_CUSTOMER_EMAIL: ${{ secrets.DEMO_CUSTOMER_EMAIL }}
      DEMO_CUSTOMER_PASSWORD: ${{ secrets.DEMO_CUSTOMER_PASSWORD }}
      DEMO_SELLER1_EMAIL: ${{ secrets.DEMO_SELLER1_EMAIL }}
      DEMO_SELLER1_PASSWORD: ${{ secrets.DEMO_SELLER1_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests
        run: npx vitest run tests/api.integration.test.js --reporter=verbose
        timeout-minutes: 10

  # 3. Docker Build Validation
  docker-build:
    name: Validate Docker Image
    runs-on: ubuntu-latest
    needs: check
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend Docker image
        run: docker build -t abn-backend:ci ./backend

      - name: Verify image runs (smoke test)
        run: |
          docker run --rm -d --name abn-test -p 5000:5000 \
            -e NODE_ENV=production \
            -e PORT=5000 \
            -e SUPABASE_URL=https://dummy.supabase.co \
            -e SUPABASE_ANON_KEY=dummy \
            -e SUPABASE_SERVICE_ROLE_KEY=dummy \
            -e MIDTRANS_CLIENT_KEY=dummy \
            -e MIDTRANS_SERVER_KEY=dummy \
            -e MIDTRANS_IS_PRODUCTION=false \
            -e OMNIROUTE_API_KEY=dummy \
            -e OMNIROUTE_API_URL=https://dummy.omniroute/v1 \
            -e OMNIROUTE_MODEL=auto \
            -e RESEND_API_KEY=dummy \
            -e RESEND_FROM_EMAIL=noreply@dummy.com \
            -e CORS_ALLOWED_ORIGINS=http://localhost:3000 \
            abn-backend:ci
          sleep 5
          curl -f http://localhost:5000/ || (docker logs abn-test && exit 1)
          docker stop abn-test