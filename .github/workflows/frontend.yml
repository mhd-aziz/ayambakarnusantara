# CI/CD Frontend — Ayam Bakar Nusantara
# - Push/PR ke main (path frontend) → unit test + build produksi + validasi Docker image.
# - Deploy ke homelab hanya pada push ke main, lewat self-hosted runner (docker compose).

name: Frontend CI/CD

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
      - "docker-compose.yml"
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
      - "docker-compose.yml"
  workflow_dispatch:

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit test (vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Vitest run
        run: npm test

  build:
    name: Build produksi
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: vite build --mode prod
        env:
          VITE_API_BASE_URL: http://127.0.0.1:5000
        run: npm run build

  docker-build:
    name: Validasi Docker image
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Build image frontend
        run: docker build --build-arg VITE_API_BASE_URL=http://127.0.0.1:5000 -t abn-frontend:ci ./frontend

  deploy:
    name: Deploy ke homelab (self-hosted)
    runs-on: self-hosted
    needs: [build, docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Pull & build & up (docker compose)
        run: |
          set -euo pipefail
          cd /media/bazyngan/DATA/Documents/ayam-bakar-nusantara
          git pull --ff-only
          docker compose up -d --build
      - name: Verifikasi container
        run: |
          sleep 8
          docker compose -f /media/bazyngan/DATA/Documents/ayam-bakar-nusantara/docker-compose.yml ps --format "table {{.Service}}\t{{.Status}}"
