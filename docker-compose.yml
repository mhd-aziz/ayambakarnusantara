services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file: ./backend/.env.prod
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://abn-api.zisaltech.site}
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend